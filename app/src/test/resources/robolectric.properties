# Robolectric 4.14 does not yet ship a sandbox for API 36 (the compileSdk). Run JVM
# tests against API 34, which is fully supported and exercises the same java.time /
# Room code paths (minSdk is 26).
sdk=34

# Use the real SQLite instead of the legacy shadow. The legacy one keeps its own table of
# connection pointers and throws "Illegal connection pointer" when Room's invalidation
# tracker refreshes after the database was closed — on a background thread, where nobody
# catches it, so coroutines-test blamed whichever test started next. See TESTING.md.
sqliteMode=NATIVE
