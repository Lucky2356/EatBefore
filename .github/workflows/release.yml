name: Release

# Собирает, подписывает и публикует релиз целиком на стороне GitHub: на компьютере
# для этого не нужно ничего, кроме браузера. Запуск — вкладка Actions → Release →
# Run workflow. Перед запуском версия в app/build.gradle.kts и раздел в CHANGELOG.md
# должны быть уже обновлены и отправлены в main: workflow ничего не коммитит сам,
# иначе тег указывал бы не на то, что собрано.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия — ровно как versionName в app/build.gradle.kts, например 1.12.0'
        required: true
        type: string
      title:
        description: 'Заголовок релиза (необязательно; по умолчанию «EatBefore <версия>»)'
        required: false
        type: string
      dry_run:
        description: 'Только проверка: собрать и подписать, но не публиковать'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Две одновременные публикации одной версии закончились бы гонкой за один тег.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      # Отпечаток сертификата, которым подписаны все релизы начиная с 1.5.0. Это
      # публичная величина — она лежит в каждом опубликованном APK. Смысл её здесь в
      # том, что сборка молча откатывается на отладочный ключ, когда настоящего нет
      # (см. app/build.gradle.kts). Такой APK установить поверх уже стоящего нельзя,
      # и узнать об этом на телефоне — слишком поздно.
      EXPECTED_CERT_SHA256: 726376faaa5d30c5fff8026d091adaf820f8fc9db20bb8d6fb938ce5c64e938f

    steps:
      - uses: actions/checkout@v7

      - name: Проверить версию
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Версия «$VERSION» не вида 1.2.3"
            exit 1
          fi
          declared=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::В app/build.gradle.kts versionName = $declared, а публикуют $VERSION. Приложение сравнивает тег со своей версией: расхождение оставит его навсегда предлагать обновление, которое уже установлено."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::Релиз v$VERSION уже есть, но это холостой прогон — продолжаю."
            else
              echo "::error::Релиз v$VERSION уже опубликован."
              exit 1
            fi
          fi

      # Раньше проверки: незачем ждать десять минут сборки, чтобы узнать, что раздела нет.
      - name: Подготовить описание релиза
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/notes.txt"
          echo "Описание релиза:"
          cat "$RUNNER_TEMP/notes.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Восстановить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.EATBEFORE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EATBEFORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Секрет EATBEFORE_KEYSTORE_BASE64 не задан — см. docs/CLOUD.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Ключ раскодировался в пустой файл — секрет записан не целиком."
            exit 1
          fi
          # Проверяем пароль сразу: иначе о нём сообщит только падение сборки минут через
          # десять, и сообщение будет про Gradle, а не про секрет.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Хранилище не открывается — проверьте EATBEFORE_STORE_PASSWORD."
            exit 1
          fi

      - name: Проверки (spotless, detekt, тесты, lint)
        run: ./gradlew spotlessCheck detekt testDebugUnitTest lintDebug --no-daemon

      - name: Собрать подписанный release APK
        env:
          EATBEFORE_STORE_FILE: ${{ runner.temp }}/release.jks
          EATBEFORE_STORE_PASSWORD: ${{ secrets.EATBEFORE_STORE_PASSWORD }}
          EATBEFORE_KEY_ALIAS: ${{ secrets.EATBEFORE_KEY_ALIAS }}
          EATBEFORE_KEY_PASSWORD: ${{ secrets.EATBEFORE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Проверить подпись
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$apk" \
            | grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]+')
          echo "Сертификат APK: $actual"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK подписан не тем ключом (ждали $EXPECTED_CERT_SHA256). Публиковать нельзя: поверх установленного приложения он не встанет."
            exit 1
          fi

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk "EatBefore-$VERSION.apk"

      - name: Опубликовать
        if: ${{ !inputs.dry_run }}
        # Заголовок приходит через окружение, а не подстановкой ${{ }} в текст скрипта:
        # подставленная строка стала бы частью команды.
        env:
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          title="${TITLE:-EatBefore $VERSION}"
          gh release create "v$VERSION" "EatBefore-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.txt"

      # Холостой прогон доходит до подписанного APK и останавливается: так проверяются
      # секреты и подпись, пока публиковать ещё нечего.
      - name: Сохранить APK холостого прогона
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: EatBefore-${{ inputs.version }}-dry-run
          path: EatBefore-${{ inputs.version }}.apk

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
