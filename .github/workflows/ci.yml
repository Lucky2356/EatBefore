name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Formatting (spotless/ktlint)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Схемы Room экспортирует KSP во время сборки, и они коммитятся — это контракт, по
      # которому MigrationTest проверяет обновление уже установленного приложения. Забыть
      # их приложить нечем не наказывалось: тест собирался по старой схеме и молча
      # проверял не то. Здесь расхождение видно сразу, а сгенерированный файл печатается —
      # его можно взять из лога и закоммитить, не собирая проект у себя.
      - name: Схемы Room совпадают с экспортированными
        run: |
          set -euo pipefail
          changed=$(git diff --name-only -- app/schemas)
          # Новая версия схемы приходит неотслеживаемым файлом, которого git diff не видит
          # вовсе — без этой половины проверка молча проходила бы ровно в том случае,
          # ради которого она и написана.
          added=$(git ls-files --others --exclude-standard -- app/schemas)
          if [ -z "$changed$added" ]; then
            echo "Схемы Room совпадают с закоммиченными."
            exit 0
          fi
          echo "::error::Экспортированные схемы Room отличаются от закоммиченных."
          for f in $changed $added; do
            echo "----- $f -----"
            cat "$f"
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Владелец репозитория — единственный автор его коммитов. Проверяются только новые
  # коммиты: то, что принёс PR, или то, что пришло этим push'ем.
  authorship:
    name: Без соавторства
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: В новых коммитах нет подписей ассистента
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # Новая ветка или история, переписанная целиком: смотрим всё, что есть.
            range="$AFTER"
          fi
          found=$(git log --format='%h %an <%ae> | %cn <%ce>%n%B' "$range" \
            | grep -inE 'co-authored-by:|claude-session:|noreply@anthropic\.com|generated with \[?claude' || true)
          if [ -n "$found" ]; then
            echo "::error::В коммитах есть подпись ассистента. Автор коммитов — владелец репозитория."
            echo "$found"
            exit 1
          fi
          echo "Подписей ассистента нет."

  instrumented:
    name: Instrumented tests (emulator)
    # Only on main. These take ~20 minutes against an emulator, which is too slow to
    # gate every pull request, but leaving them out entirely meant the Room migration
    # test — the only automated protection against losing data on upgrade — ran solely
    # when someone remembered to run it by hand.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without KVM the emulator falls back to software rendering and the run times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Animations skew Compose's idling; the AVD is disposable, so disable them.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/
